<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mfecane RTS</title>
    <style>
      /*
       * One palette, named once.
       *
       * The HUD had grown eleven hard-coded greys and six ambers across four files,
       * which is how a surface ends up nearly consistent: every new panel matched the
       * one beside it to within a couple of points and the drift only shows when two
       * of them are finally on screen together.
       */
      :root {
        --ink: #14110d;
        --card: rgba(23, 19, 14, 0.9);
        --card-solid: #1c1811;
        --edge: rgba(200, 168, 106, 0.16);
        --edge-strong: rgba(200, 168, 106, 0.34);
        --text: #e8e0d0;
        --text-dim: #9c9280;
        --gold: #d6b26a;
        --gold-dim: #a88c52;
        --amber: #d9973a;
        --green: #8fbf6a;
        --radius: 5px;
        /* One gutter everywhere, so the four corners agree with each other. */
        --gutter: 14px;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
      }

      /*
       * The two secondary cards share one line, below the two primary bars.
       *
       * The controls sat in the top-left CORNER and the resource bar in the top-right,
       * which is fine until the window narrows: at 1100px the bar reaches far enough
       * left to cover a line of the controls. Dropping both secondary cards below the
       * bar's band removes the collision at every width rather than at the ones that
       * were tested, and it lines the controls up with the stats opposite them.
       */
      .hud-controls {
        position: absolute;
        top: calc(var(--gutter) + 64px);
        left: var(--gutter);
        /* Wide enough that a line of keys is a LINE. At 260px every one of them
           wrapped, which doubled the card's height and put half of it behind the
           command panel — a reference card you cannot read is worse than none. */
        max-width: 392px;
        pointer-events: none;
        user-select: none;
      }

      /* Numbers with numbers: the stats hang under the resource bar. */
      .debug-overlay {
        position: absolute;
        top: calc(var(--gutter) + 64px);
        right: var(--gutter);
        pointer-events: none;
        user-select: none;
      }

      .debug-overlay,
      .controls {
        padding: 9px 12px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
      }

      .debug-overlay strong,
      .controls strong {
        display: block;
        margin-bottom: 6px;
        color: var(--gold-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
      }

      .debug-overlay {
        min-width: 176px;
        color: var(--text-dim);
      }

      /* Smaller and dimmer than the readouts a player acts on: this is a reference card
         they read once, not a number they watch. */
      .controls__body {
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-dim);
      }

      .controls__note {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--edge);
        color: #7f7768;
      }

      /*
       * The village's standing, read left to right in the order it is decided in: what
       * is in hand, what the year is doing, what the land will carry, where the village
       * stands against the objective. Separators between the groups rather than a flat
       * run of text, because the bar had become one sentence of five clauses.
       */
      .resource-bar {
        position: absolute;
        top: var(--gutter);
        right: var(--gutter);
        display: flex;
        /* Wraps rather than growing leftward: with meat, skins and ivory on it the bar
           ran over the How to play button at 1100px. Never wider than the room right of
           that button, and the groups drop to a second line when they run out of it. */
        flex-wrap: wrap;
        justify-content: flex-end;
        row-gap: 2px;
        max-width: calc(100% - 2 * var(--gutter) - 150px);
        gap: 0;
        align-items: center;
        padding: 9px 4px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
        pointer-events: none;
        user-select: none;
      }

      .resource-bar__season {
        color: var(--text-dim);
      }

      .resource-bar__season.is-severe {
        color: #d94a3a;
      }

      .resource-bar__warning {
        color: #d94a3a;
      }

      /* The season's margin. Neutral while it is positive — it is only worth colouring
         when it is telling the player not to raise another household. */
      .resource-bar__margin {
        color: #9a9382;
      }

      .resource-bar__margin.is-negative {
        color: #d9973a;
      }

      .resource-bar__driving {
        color: #9ec86a;
      }

      .resource-bar__herd {
        color: #c8a86a;
      }

      /* Who is free. Neutral while there are spare hands; amber when work is waiting. */
      .resource-bar__work {
        color: #9a9382;
      }

      .resource-bar__work.is-negative {
        color: #d9973a;
      }

      .resource-bar > span {
        padding: 0 14px;
        white-space: nowrap;
      }

      /* Hairlines between the groups, and none before the first or after an empty one. */
      .resource-bar > span + span:not(:empty) {
        border-left: 1px solid var(--edge);
      }

      .resource-bar > span:empty {
        display: none;
      }

      /*
       * The command bar: people, the selection, and what the village can do, along the
       * bottom edge and stopping short of the minimap.
       *
       * It replaced a card in the bottom-left corner that grew upward with everything
       * the village could do until it ran off the screen and under the controls card.
       * A fixed height, and each part scrolls within itself, so nothing the village
       * gains can push the bar into the map again. The three columns hold at 1024px:
       * 180 + 230 + 380 is about what is left beside the minimap. The tab column is the
       * widest because ten buildings, each with its price, have to be seen at once.
       */
      .bar {
        --bar-height: 184px;
        position: absolute;
        left: var(--gutter);
        right: calc(var(--gutter) + 176px + 10px);
        bottom: var(--gutter);
        height: var(--bar-height);
        display: grid;
        grid-template-columns: 180px minmax(230px, 1fr) minmax(380px, 2.6fr);
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
        user-select: none;
      }

      .bar__section {
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 10px 12px;
      }

      /*
       * More below. A section that scrolls fades out at its foot, so the buildings under
       * the fold at 1280px read as "there is more" rather than as "that is all".
       */
      .bar__section.is-more {
        -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
        mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
      }

      .bar__section + .bar__section {
        border-left: 1px solid var(--edge);
      }

      .bar__roles {
        display: grid;
        grid-template-columns: 1fr;
        gap: 3px;
      }

      /* Compound, so it outranks .panel__button's own font and padding further down. */
      .panel__button.bar__role {
        padding: 1px 8px;
        font-size: 12px;
        color: #cfc6b4;
        background: transparent;
        border-color: transparent;
      }

      .panel__button.bar__role--idle:not(:disabled) {
        color: var(--gold);
        border-color: var(--edge-strong);
      }

      .bar__role[hidden] {
        display: none;
      }

      .panel__button.bar__role:disabled {
        color: #6d6557;
        cursor: default;
        background: transparent;
        border-color: transparent;
      }

      .bar__tabs {
        display: flex;
        flex-direction: column;
        padding-top: 0;
      }

      .bar__tablist {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 2px;
        margin: 0 -12px 10px;
        padding: 0 8px;
        border-bottom: 1px solid var(--edge);
        background: var(--card-solid);
      }

      .bar__tab {
        position: relative;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-dim);
        background: transparent;
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 8px 10px 6px;
        cursor: pointer;
      }

      .bar__tab:hover {
        color: var(--text);
      }

      .bar__tab.is-active {
        color: var(--gold);
        border-bottom-color: var(--gold);
      }

      .bar__tab:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: -2px;
      }

      /* Something on this tab wants an answer — a neighbour asking, a hungry village. */
      .bar__tab.has-news::after {
        content: '';
        position: absolute;
        top: 6px;
        right: 2px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--amber);
      }

      .bar__tabbody[hidden] {
        display: none;
      }

      .bar__grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
        gap: 6px;
      }

      .bar__row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 6px;
      }

      .bar__row:empty {
        display: none;
      }

      .bar__tabbody > .bar__row {
        margin-bottom: 10px;
      }

      .panel__heading--sub {
        margin-top: 2px;
      }

      /* What a click on the ground will do, floating just above the bar. */
      .bar__tool {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        padding: 6px 14px;
        border: 1px solid var(--gold-dim);
        border-radius: var(--radius);
        background: var(--card-solid);
        color: var(--gold);
        white-space: nowrap;
        pointer-events: none;
      }

      .bar__tool[hidden] {
        display: none;
      }

      .panel__heading {
        color: var(--gold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        margin-bottom: 6px;
      }

      .panel__detail {
        color: var(--text-dim);
        margin-bottom: 9px;
        min-height: 1em;
      }

      .panel__detail:empty {
        margin-bottom: 0;
        min-height: 0;
      }

      .panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .panel__trade {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .panel__trade .panel__button {
        background: rgba(44, 52, 38, 0.8);
        border-color: #3f4a2f;
      }

      .panel__trade .panel__button:hover {
        background: #3f4a2f;
        border-color: #9ec86a;
      }

      /* The herd row: slaughtering is the village's decision, not a selected unit's. */
      .panel__role {
        font-size: 12px;
        line-height: 1.5;
        color: #b8a882;
      }
      .panel__role:first-child {
        color: var(--gold);
      }
      .panel__button.is-refused {
        opacity: 0.55;
        border-color: rgba(214, 178, 106, 0.16);
      }
      .panel__why {
        display: block;
        font-size: 11px;
        line-height: 1.3;
        margin-top: 2px;
        color: #c08a52;
      }
      .bar__row .panel__button.is-urgent {
        border-color: rgba(214, 138, 58, 0.75);
        color: #e8b06a;
      }
      .bar__row .panel__button.is-active {
        border-color: rgba(214, 178, 106, 0.55);
        background: rgba(214, 178, 106, 0.14);
      }

      /* Taking a building down: the same warning red as the slaughter, for the same
         reason — it cannot be undone. */
      .panel__button--danger {
        background: rgba(72, 42, 34, 0.8);
        border-color: #6a3f2c;
      }

      .panel__button--danger:hover,
      .panel__button--danger[data-armed='1'] {
        background: #6a3f2c;
        border-color: #d88a5e;
      }

      /* Standing ties, below the rates they price. Warmer than the trade row: a tie is
         not a transaction and should not read as one. */
      .panel__alliance {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
      }

      .panel__alliance:empty {
        display: none;
      }

      .panel__alliance .panel__button {
        background: rgba(60, 44, 34, 0.8);
        border-color: #5a4029;
      }

      .panel__alliance .panel__button:hover {
        background: #5a4029;
        border-color: #d8a35e;
      }

      .panel__standing {
        color: var(--text-dim);
        font-size: 12px;
      }

      /* A site nobody is working on. The one state the player has to act on. */
      .panel__detail--idle {
        color: var(--amber);
      }

      .panel__button {
        font: inherit;
        text-align: left;
        color: var(--text);
        background: rgba(58, 50, 38, 0.72);
        border: 1px solid var(--edge-strong);
        border-radius: 4px;
        padding: 5px 9px;
        cursor: pointer;
        transition: background 90ms linear, border-color 90ms linear;
      }

      .panel__button:hover {
        background: #4a4029;
        border-color: var(--gold);
      }

      /* Keyboard focus has to be visible, and the hover colour is not focus. */
      .panel__button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      .panel__button:active {
        background: #5a4f33;
      }

      /* An action with its price on its face: name, then cost, then why not. */
      .panel__button--action {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 4px 8px;
        line-height: 1.3;
      }

      .panel__name {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .panel__cost {
        display: flex;
        flex-wrap: wrap;
        column-gap: 9px;
        font-size: 11px;
        color: var(--text-dim);
      }

      .panel__cost > span {
        white-space: nowrap;
      }

      /* The part of the price the village is short of. */
      .panel__cost > .is-short {
        color: #d9973a;
      }

      .panel__why:empty {
        display: none;
      }

      /* The key that does the same thing. Quiet: it is for the second time, not the first. */
      .panel__key {
        margin-left: 8px;
        padding: 0 5px;
        font: inherit;
        font-size: 10px;
        line-height: 16px;
        color: var(--gold-dim);
        border: 1px solid var(--edge-strong);
        border-radius: 3px;
      }

      .panel__name .panel__key {
        margin-left: 0;
      }

      /* The tool in hand: the button that armed it stays lit until it is put down. */
      .panel__button.is-armed {
        background: rgba(214, 178, 106, 0.2);
        border-color: var(--gold);
        opacity: 1;
      }

      .panel__how:empty {
        display: none;
      }

      .panel__how {
        margin-top: 8px;
        font-size: 11px;
        line-height: 1.45;
        color: #8a8272;
      }

      .minimap {
        position: absolute;
        right: var(--gutter);
        bottom: var(--gutter);
        width: 176px;
        height: 176px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: #0b0906;
        cursor: crosshair;
        image-rendering: pixelated;
      }

      /*
       * Narrow windows. At 1024px the build tab had room for two buttons a row and
       * showed four buildings of ten; a smaller minimap and tighter people and selection
       * columns buy a third. The minimap maps clicks from its on-screen box, so shrinking
       * it here moves nothing it points at.
       */
      @media (max-width: 1200px) {
        .minimap {
          width: 140px;
          height: 140px;
        }

        .bar {
          right: calc(var(--gutter) + 140px + 10px);
          grid-template-columns: 160px minmax(200px, 1fr) minmax(340px, 2.6fr);
        }
      }

      /* Sits above the resource bar, out of the way of the command panel and the
         minimap — the two corners a player's hands are already in. */
      .setup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14110d;
        z-index: 10;
      }

      .setup-panel {
        min-width: 320px;
        padding: 28px 32px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(28, 24, 17, 0.96);
        color: #e8d9a8;
      }

      .setup-panel h1 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .setup-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .setup-field select,
      .setup-field input {
        min-width: 170px;
        padding: 5px 8px;
        border: 1px solid #6d5c3c;
        border-radius: 3px;
        background: #241f17;
        color: #e8d9a8;
        font: inherit;
        font-size: 14px;
      }

      /* News that is not the simulation's own — "Village saved". */
      .notice {
        position: fixed;
        left: 50%;
        bottom: calc(var(--gutter) + 184px + 48px);
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(20, 17, 13, 0.92);
        border: 1px solid var(--edge);
        color: #e8d9a8;
        pointer-events: none;
        z-index: 20;
      }

      .setup-continue {
        margin-bottom: 4px;
      }

      .setup-note {
        margin: 0 0 14px;
        font-size: 12px;
        color: #9a9382;
      }

      .setup-start {
        width: 100%;
        margin-top: 18px;
        padding: 9px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: #3a3122;
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.03em;
        cursor: pointer;
      }

      /*
       * Centred in the window, below the resource bar.
       *
       * It was centred in what was left beside the controls card, because the card
       * stood open down the left edge and the banner slid under it at 1100px. The card
       * is folded to one line now and the controls live in the command bar, so the
       * middle of the map is the middle of the window again.
       */
      .alerts {
        position: absolute;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 16px;
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        background: var(--card);
        color: #e8d9a8;
        font-size: 14px;
        letter-spacing: 0.03em;
        pointer-events: none;
        white-space: nowrap;
      }

      .emptied-banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 22px 44px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(20, 17, 13, 0.94);
        color: #e8d9a8;
        font-size: 26px;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }

      .emptied-again {
        display: block;
        margin: 16px auto 0;
        padding: 7px 20px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: rgba(40, 34, 24, 0.95);
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      /*
       * The slow tooltip (src/ui/tooltip.ts). Fixed to the viewport and above
       * everything, including an open dialog, because it is placed from the control's
       * on-screen box rather than from any container.
       */
      .tooltip {
        position: fixed;
        z-index: 1000;
        max-width: 300px;
        padding: 7px 10px;
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        background: var(--card-solid);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-line;
        pointer-events: none;
      }
      .tooltip::first-line {
        color: var(--gold);
      }

      /* The bar's readouts carry tips, so they have to be reachable by the pointer. */
      .resource-bar > span {
        pointer-events: auto;
        cursor: help;
      }

      /* How to play: top left, where a player's eye goes first. */
      .help-button {
        position: absolute;
        top: var(--gutter);
        left: var(--gutter);
        font: inherit;
        color: var(--gold);
        background: var(--card);
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        padding: 6px 12px;
        cursor: pointer;
        transition: background 90ms linear, border-color 90ms linear;
      }
      .help-button:hover {
        background: #4a4029;
        border-color: var(--gold);
      }
      .help-button:focus-visible,
      .help__close:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      .help {
        width: min(680px, calc(100vw - 32px));
        max-height: calc(100vh - 64px);
        padding: 0;
        border: 1px solid var(--edge-strong);
        border-radius: 6px;
        background: var(--card-solid);
        color: var(--text);
        font: inherit;
      }
      .help[open] {
        display: flex;
        flex-direction: column;
      }
      .help::backdrop {
        background: rgba(10, 8, 6, 0.62);
      }
      .help__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--edge);
      }
      .help h2 {
        margin: 0;
        color: var(--gold);
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .help__close {
        font: inherit;
        color: var(--text);
        background: rgba(58, 50, 38, 0.72);
        border: 1px solid var(--edge-strong);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .help__close:hover {
        background: #4a4029;
        border-color: var(--gold);
      }
      .help__body {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 18px 18px;
      }
      .help__intro {
        color: var(--text);
      }
      .help h3 {
        margin: 18px 0 4px;
        color: var(--gold);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .help p {
        margin: 6px 0;
        color: #cfc6b4;
      }
      .help ul {
        margin: 6px 0;
        padding-left: 18px;
        color: #cfc6b4;
      }
      .help li {
        margin: 3px 0;
      }
      .help__terms {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 8px 0 0;
      }
      .help__terms dt {
        color: var(--gold);
      }
      .help__terms dd {
        margin: 0;
        color: #cfc6b4;
      }
      @media (max-width: 520px) {
        .help__terms {
          grid-template-columns: 1fr;
        }
        .help__terms dd {
          margin-bottom: 6px;
        }
      }

      /* The asset gallery (src/ui/gallery.ts). Dev builds only. */
      .setup-dev {
        display: block;
        margin-top: 14px;
        color: var(--text-dim);
        font-size: 11px;
        text-align: center;
      }
      .setup-dev:hover {
        color: var(--gold);
      }
      html:has(.gallery),
      body:has(.gallery) {
        overflow: auto;
        height: auto;
      }
      .gallery {
        --bg: #a08752;
        min-height: 100vh;
        padding: 0 20px 60px;
        background: var(--ink);
        color: var(--text);
      }
      .gallery[data-background='veld'] { --bg: #a08752; }
      .gallery[data-background='dark'] { --bg: #1c1811; }
      .gallery[data-background='light'] { --bg: #e8e0d0; }
      .gallery[data-background='checker'] {
        --bg: repeating-conic-gradient(#8a8a8a 0% 25%, #b8b8b8 0% 50%) 0 0 / 16px 16px;
      }
      .gallery__header {
        display: flex;
        align-items: baseline;
        gap: 20px;
        padding: 18px 0 8px;
      }
      .gallery__title {
        margin: 0;
        color: var(--gold);
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .gallery__back {
        color: var(--text-dim);
      }
      .gallery__controls,
      .gallery__nav {
        position: sticky;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 18px;
        padding: 8px 0;
        background: var(--ink);
      }
      .gallery__controls { top: 0; }
      .gallery__nav {
        top: 40px;
        border-bottom: 1px solid var(--edge);
      }
      .gallery__toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .gallery__toggle-label {
        margin-right: 4px;
        color: var(--text-dim);
        font-size: 11px;
      }
      .gallery__chip {
        font: inherit;
        font-size: 11px;
        color: var(--text);
        background: rgba(58, 50, 38, 0.72);
        border: 1px solid var(--edge-strong);
        border-radius: 4px;
        padding: 2px 8px;
        cursor: pointer;
      }
      .gallery__chip.is-on {
        border-color: var(--gold);
        color: var(--gold);
      }
      .gallery__link {
        color: var(--gold-dim);
        font-size: 12px;
      }
      .gallery__section {
        scroll-margin-top: 90px;
      }
      .gallery__heading {
        margin: 28px 0 10px;
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .gallery__card {
        display: inline-block;
        vertical-align: top;
        margin: 0 10px 12px 0;
        padding: 8px 10px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card-solid);
      }
      .gallery__card--wide {
        display: block;
      }
      .gallery__name {
        margin-bottom: 6px;
        color: var(--gold);
      }
      .gallery__row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }
      .gallery__anim {
        width: 120px;
        flex: none;
        color: var(--text-dim);
        font-size: 11px;
      }
      .gallery__strip,
      .gallery__tiles {
        background: var(--bg);
        border-radius: 3px;
      }
      .gallery__tiles {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px;
      }
      .gallery__more {
        margin-top: 4px;
        color: var(--text-dim);
        font-size: 11px;
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
