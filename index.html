<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mfecane RTS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14110d;
        color: #e8e0d0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
      }

      .debug-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.82);
        pointer-events: none;
        user-select: none;
        min-width: 168px;
      }

      .debug-overlay strong {
        display: block;
        margin-bottom: 6px;
        color: #c8a86a;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
      }

      .resource-bar {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 10px 16px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.82);
        pointer-events: none;
        user-select: none;
      }

      .resource-bar__season {
        color: #8a8070;
      }

      .resource-bar__season.is-severe {
        color: #d94a3a;
      }

      .resource-bar__warning {
        color: #d94a3a;
      }

      .resource-bar__herd {
        color: #c8a86a;
      }

      .resource-bar__herd.is-holding {
        color: #8fbf6a;
        font-weight: 600;
      }

      .outcome-banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 22px 44px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(20, 17, 13, 0.94);
        color: #e8d9a8;
        font-size: 26px;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }

      .outcome-banner.is-defeat {
        border-color: #d94a3a;
        color: #d94a3a;
      }

      .debug-overlay__hint {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #3a3226;
        color: #8a8070;
        max-width: 220px;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
