<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mfecane RTS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #14110d;
        color: #e8e0d0;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
      }

      .debug-overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.82);
        pointer-events: none;
        user-select: none;
        min-width: 168px;
      }

      .debug-overlay strong {
        display: block;
        margin-bottom: 6px;
        color: #c8a86a;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
      }

      .resource-bar {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 18px;
        align-items: center;
        padding: 10px 16px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.82);
        pointer-events: none;
        user-select: none;
      }

      .resource-bar__season {
        color: #8a8070;
      }

      .resource-bar__season.is-severe {
        color: #d94a3a;
      }

      .resource-bar__warning {
        color: #d94a3a;
      }

      /* The season's margin. Neutral while it is positive — it is only worth colouring
         when it is telling the player not to raise another household. */
      .resource-bar__margin {
        color: #9a9382;
      }

      .resource-bar__margin.is-negative {
        color: #d9973a;
      }

      .resource-bar__driving {
        color: #9ec86a;
      }

      .resource-bar__herd {
        color: #c8a86a;
      }

      .resource-bar__herd.is-holding {
        color: #8fbf6a;
        font-weight: 600;
      }

      .panel {
        position: absolute;
        left: 12px;
        bottom: 12px;
        min-width: 260px;
        max-width: 340px;
        padding: 10px 14px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.86);
        user-select: none;
      }

      .panel__heading {
        color: #c8a86a;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-size: 11px;
        margin-bottom: 6px;
      }

      .panel__detail {
        color: #8a8070;
        margin-bottom: 8px;
        min-height: 1em;
      }

      .panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      /* Trade sits apart from the selection's actions, because it belongs to the
         village rather than to whatever happens to be selected. */
      .panel__trade {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #3a3226;
      }

      .panel__trade:empty {
        display: none;
      }

      .panel__trade .panel__button {
        background: rgba(44, 52, 38, 0.8);
        border-color: #3f4a2f;
      }

      .panel__trade .panel__button:hover {
        background: #3f4a2f;
        border-color: #9ec86a;
      }

      /* The herd row: slaughtering is the village's decision, not a selected unit's. */
      .panel__button.is-refused {
        opacity: 0.55;
        border-color: rgba(214, 178, 106, 0.16);
      }
      .panel__why {
        display: block;
        font-size: 11px;
        line-height: 1.3;
        margin-top: 2px;
        color: #c08a52;
      }
      .panel__ration {
        border-top: 1px solid rgba(214, 178, 106, 0.18);
        padding-top: 8px;
        margin-top: 8px;
      }
      .panel__ration .panel__button.is-urgent {
        border-color: rgba(214, 138, 58, 0.75);
        color: #e8b06a;
      }
      .panel__ration .panel__button.is-active {
        border-color: rgba(214, 178, 106, 0.55);
        background: rgba(214, 178, 106, 0.14);
      }
      .panel__herd {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #3a3226;
      }

      .panel__herd:empty {
        display: none;
      }

      .panel__herd .panel__button {
        background: rgba(72, 42, 34, 0.8);
        border-color: #6a3f2c;
      }

      .panel__herd .panel__button:hover {
        background: #6a3f2c;
        border-color: #d88a5e;
      }

      /* Standing ties, below the rates they price. Warmer than the trade row: a tie is
         not a transaction and should not read as one. */
      .panel__alliance {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #3a3226;
      }

      .panel__alliance:empty {
        display: none;
      }

      .panel__alliance .panel__button {
        background: rgba(60, 44, 34, 0.8);
        border-color: #5a4029;
      }

      .panel__alliance .panel__button:hover {
        background: #5a4029;
        border-color: #d8a35e;
      }

      .panel__standing {
        color: #b8ab92;
        font-size: 12px;
      }

      /* A site nobody is working on. The one state the player has to act on. */
      .panel__detail--idle {
        color: #d9973a;
      }

      .panel__button {
        font: inherit;
        color: #e8e0d0;
        background: rgba(58, 50, 38, 0.8);
        border: 1px solid #4a4029;
        border-radius: 3px;
        padding: 5px 9px;
        cursor: pointer;
      }

      .panel__button:hover {
        background: #4a4029;
        border-color: #c8a86a;
      }

      .panel__button:active {
        background: #5a4f33;
      }

      .minimap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 176px;
        height: 176px;
        border: 1px solid #3a3226;
        border-radius: 4px;
        background: #0b0906;
        cursor: crosshair;
        image-rendering: pixelated;
      }

      /* Sits above the resource bar, out of the way of the command panel and the
         minimap — the two corners a player's hands are already in. */
      .setup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14110d;
        z-index: 10;
      }

      .setup-panel {
        min-width: 320px;
        padding: 28px 32px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(28, 24, 17, 0.96);
        color: #e8d9a8;
      }

      .setup-panel h1 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .setup-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .setup-field select,
      .setup-field input {
        min-width: 170px;
        padding: 5px 8px;
        border: 1px solid #6d5c3c;
        border-radius: 3px;
        background: #241f17;
        color: #e8d9a8;
        font: inherit;
        font-size: 14px;
      }

      .setup-start {
        width: 100%;
        margin-top: 18px;
        padding: 9px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: #3a3122;
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.03em;
        cursor: pointer;
      }

      .alerts {
        position: absolute;
        top: 74px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 16px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: rgba(20, 17, 13, 0.9);
        color: #e8d9a8;
        font-size: 14px;
        letter-spacing: 0.03em;
        pointer-events: none;
        white-space: nowrap;
      }

      .outcome-banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 22px 44px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(20, 17, 13, 0.94);
        color: #e8d9a8;
        font-size: 26px;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }

      .outcome-again {
        display: block;
        margin: 16px auto 0;
        padding: 7px 20px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: rgba(40, 34, 24, 0.95);
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      .outcome-banner.is-defeat {
        border-color: #d94a3a;
        color: #d94a3a;
      }

      .debug-overlay__hint {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #3a3226;
        color: #8a8070;
        max-width: 220px;
        white-space: normal;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
