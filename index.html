<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mfecane RTS</title>
    <style>
      /*
       * One palette, named once.
       *
       * The HUD had grown eleven hard-coded greys and six ambers across four files,
       * which is how a surface ends up nearly consistent: every new panel matched the
       * one beside it to within a couple of points and the drift only shows when two
       * of them are finally on screen together.
       */
      :root {
        --ink: #14110d;
        --card: rgba(23, 19, 14, 0.9);
        --card-solid: #1c1811;
        --edge: rgba(200, 168, 106, 0.16);
        --edge-strong: rgba(200, 168, 106, 0.34);
        --text: #e8e0d0;
        --text-dim: #9c9280;
        --gold: #d6b26a;
        --gold-dim: #a88c52;
        --amber: #d9973a;
        --green: #8fbf6a;
        --radius: 5px;
        /* One gutter everywhere, so the four corners agree with each other. */
        --gutter: 14px;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        color: var(--text);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #app canvas {
        display: block;
      }

      /*
       * The two secondary cards share one line, below the two primary bars.
       *
       * The controls sat in the top-left CORNER and the resource bar in the top-right,
       * which is fine until the window narrows: at 1100px the bar reaches far enough
       * left to cover a line of the controls. Dropping both secondary cards below the
       * bar's band removes the collision at every width rather than at the ones that
       * were tested, and it lines the controls up with the stats opposite them.
       */
      .hud-controls {
        position: absolute;
        top: calc(var(--gutter) + 48px);
        left: var(--gutter);
        /* Wide enough that a line of keys is a LINE. At 260px every one of them
           wrapped, which doubled the card's height and put half of it behind the
           command panel — a reference card you cannot read is worse than none. */
        max-width: 392px;
        pointer-events: none;
        user-select: none;
      }

      /* Numbers with numbers: the stats hang under the resource bar. */
      .debug-overlay {
        position: absolute;
        top: calc(var(--gutter) + 48px);
        right: var(--gutter);
        pointer-events: none;
        user-select: none;
      }

      .debug-overlay,
      .controls {
        padding: 9px 12px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
      }

      .debug-overlay strong,
      .controls strong {
        display: block;
        margin-bottom: 6px;
        color: var(--gold-dim);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
      }

      .debug-overlay {
        min-width: 176px;
        color: var(--text-dim);
      }

      /* Smaller and dimmer than the readouts a player acts on: this is a reference card
         they read once, not a number they watch. */
      .controls__body {
        font-size: 11px;
        line-height: 1.6;
        color: var(--text-dim);
      }

      .controls__note {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--edge);
        color: #7f7768;
      }

      /*
       * The village's standing, read left to right in the order it is decided in: what
       * is in hand, what the year is doing, what the land will carry, where the village
       * stands against the objective. Separators between the groups rather than a flat
       * run of text, because the bar had become one sentence of five clauses.
       */
      .resource-bar {
        position: absolute;
        top: var(--gutter);
        right: var(--gutter);
        display: flex;
        gap: 0;
        align-items: center;
        padding: 9px 4px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
        pointer-events: none;
        user-select: none;
      }

      .resource-bar__season {
        color: var(--text-dim);
      }

      .resource-bar__season.is-severe {
        color: #d94a3a;
      }

      .resource-bar__warning {
        color: #d94a3a;
      }

      /* The season's margin. Neutral while it is positive — it is only worth colouring
         when it is telling the player not to raise another household. */
      .resource-bar__margin {
        color: #9a9382;
      }

      .resource-bar__margin.is-negative {
        color: #d9973a;
      }

      .resource-bar__driving {
        color: #9ec86a;
      }

      .resource-bar__herd {
        color: #c8a86a;
      }

      /* Who is free. Neutral while there are spare hands; amber when work is waiting. */
      .resource-bar__work {
        color: #9a9382;
      }

      .resource-bar__work.is-negative {
        color: #d9973a;
      }

      .resource-bar > span {
        padding: 0 14px;
        white-space: nowrap;
      }

      /* Hairlines between the groups, and none before the first or after an empty one. */
      .resource-bar > span + span:not(:empty) {
        border-left: 1px solid var(--edge);
      }

      .resource-bar > span:empty {
        display: none;
      }

      .panel {
        position: absolute;
        left: var(--gutter);
        bottom: var(--gutter);
        min-width: 280px;
        max-width: 360px;
        /*
         * Never tall enough to reach the controls card in the opposite corner.
         *
         * The panel grows upward and the village has a lot to offer it — eight
         * buildings, five techs, six trades, the ration, the cull and an alliance — so
         * with troops selected it ran the full height of the screen and overlapped the
         * controls. The reserve is the controls card's own height plus both gutters.
         */
        max-height: calc(100vh - 296px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 11px 14px 12px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: var(--card);
        user-select: none;
      }

      .panel__heading {
        color: var(--gold);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
        margin-bottom: 6px;
      }

      .panel__detail {
        color: var(--text-dim);
        margin-bottom: 9px;
        min-height: 1em;
      }

      .panel__detail:empty {
        margin-bottom: 0;
        min-height: 0;
      }

      .panel__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      /* Trade sits apart from the selection's actions, because it belongs to the
         village rather than to whatever happens to be selected. */
      .panel__trade {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--edge);
      }

      .panel__trade:empty {
        display: none;
      }

      .panel__trade .panel__button {
        background: rgba(44, 52, 38, 0.8);
        border-color: #3f4a2f;
      }

      .panel__trade .panel__button:hover {
        background: #3f4a2f;
        border-color: #9ec86a;
      }

      /* The herd row: slaughtering is the village's decision, not a selected unit's. */
      .panel__role {
        font-size: 12px;
        line-height: 1.5;
        color: #b8a882;
      }
      .panel__role:first-child {
        color: var(--gold);
      }
      .panel__button.is-refused {
        opacity: 0.55;
        border-color: rgba(214, 178, 106, 0.16);
      }
      .panel__why {
        display: block;
        font-size: 11px;
        line-height: 1.3;
        margin-top: 2px;
        color: #c08a52;
      }
      .panel__ration {
        border-top: 1px solid var(--edge);
        padding-top: 9px;
        margin-top: 9px;
      }
      .panel__ration .panel__button.is-urgent {
        border-color: rgba(214, 138, 58, 0.75);
        color: #e8b06a;
      }
      .panel__ration .panel__button.is-active {
        border-color: rgba(214, 178, 106, 0.55);
        background: rgba(214, 178, 106, 0.14);
      }
      .panel__herd {
        display: flex;
        gap: 6px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--edge);
      }

      .panel__herd:empty {
        display: none;
      }

      .panel__herd .panel__button {
        background: rgba(72, 42, 34, 0.8);
        border-color: #6a3f2c;
      }

      .panel__herd .panel__button:hover {
        background: #6a3f2c;
        border-color: #d88a5e;
      }

      /* Taking a building down: the same warning red as the slaughter, for the same
         reason — it cannot be undone. */
      .panel__button--danger {
        background: rgba(72, 42, 34, 0.8);
        border-color: #6a3f2c;
      }

      .panel__button--danger:hover,
      .panel__button--danger[data-armed='1'] {
        background: #6a3f2c;
        border-color: #d88a5e;
      }

      /* Standing ties, below the rates they price. Warmer than the trade row: a tie is
         not a transaction and should not read as one. */
      .panel__alliance {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
        padding-top: 9px;
        border-top: 1px solid var(--edge);
      }

      .panel__alliance:empty {
        display: none;
      }

      .panel__alliance .panel__button {
        background: rgba(60, 44, 34, 0.8);
        border-color: #5a4029;
      }

      .panel__alliance .panel__button:hover {
        background: #5a4029;
        border-color: #d8a35e;
      }

      .panel__standing {
        color: var(--text-dim);
        font-size: 12px;
      }

      /* A site nobody is working on. The one state the player has to act on. */
      .panel__detail--idle {
        color: var(--amber);
      }

      .panel__button {
        font: inherit;
        text-align: left;
        color: var(--text);
        background: rgba(58, 50, 38, 0.72);
        border: 1px solid var(--edge-strong);
        border-radius: 4px;
        padding: 5px 9px;
        cursor: pointer;
        transition: background 90ms linear, border-color 90ms linear;
      }

      .panel__button:hover {
        background: #4a4029;
        border-color: var(--gold);
      }

      /* Keyboard focus has to be visible, and the hover colour is not focus. */
      .panel__button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      .panel__button:active {
        background: #5a4f33;
      }

      .minimap {
        position: absolute;
        right: var(--gutter);
        bottom: var(--gutter);
        width: 176px;
        height: 176px;
        border: 1px solid var(--edge);
        border-radius: var(--radius);
        background: #0b0906;
        cursor: crosshair;
        image-rendering: pixelated;
      }

      /* Sits above the resource bar, out of the way of the command panel and the
         minimap — the two corners a player's hands are already in. */
      .setup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14110d;
        z-index: 10;
      }

      .setup-panel {
        min-width: 320px;
        padding: 28px 32px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(28, 24, 17, 0.96);
        color: #e8d9a8;
      }

      .setup-panel h1 {
        margin: 0 0 20px;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
      }

      .setup-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 12px;
        font-size: 14px;
      }

      .setup-field select,
      .setup-field input {
        min-width: 170px;
        padding: 5px 8px;
        border: 1px solid #6d5c3c;
        border-radius: 3px;
        background: #241f17;
        color: #e8d9a8;
        font: inherit;
        font-size: 14px;
      }

      /* News that is not the simulation's own — "Village saved". */
      .notice {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        padding: 8px 16px;
        background: rgba(20, 17, 13, 0.92);
        border: 1px solid var(--edge);
        color: #e8d9a8;
        pointer-events: none;
        z-index: 20;
      }

      .setup-continue {
        margin-bottom: 4px;
      }

      .setup-note {
        margin: 0 0 14px;
        font-size: 12px;
        color: #9a9382;
      }

      .setup-start {
        width: 100%;
        margin-top: 18px;
        padding: 9px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: #3a3122;
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.03em;
        cursor: pointer;
      }

      /*
       * Centred in the map, not in the window.
       *
       * Centred on the window it slid under the controls card the moment the window
       * narrowed — at 1100px the two overlapped by fifty pixels and a line of the
       * reference card read through a translucent banner. The left offset is the
       * controls' own width, so the alert centres in what is actually left.
       */
      .alerts {
        position: absolute;
        top: 74px;
        left: calc(406px + (100% - 406px) / 2);
        transform: translateX(-50%);
        padding: 7px 16px;
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        background: var(--card);
        color: #e8d9a8;
        font-size: 14px;
        letter-spacing: 0.03em;
        pointer-events: none;
        white-space: nowrap;
      }

      .emptied-banner {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 22px 44px;
        border: 1px solid #c8a86a;
        border-radius: 6px;
        background: rgba(20, 17, 13, 0.94);
        color: #e8d9a8;
        font-size: 26px;
        letter-spacing: 0.04em;
        pointer-events: none;
        user-select: none;
      }

      .emptied-again {
        display: block;
        margin: 16px auto 0;
        padding: 7px 20px;
        border: 1px solid #c8a86a;
        border-radius: 4px;
        background: rgba(40, 34, 24, 0.95);
        color: #e8d9a8;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }

      /*
       * The slow tooltip (src/ui/tooltip.ts). Fixed to the viewport and above
       * everything, including an open dialog, because it is placed from the control's
       * on-screen box rather than from any container.
       */
      .tooltip {
        position: fixed;
        z-index: 1000;
        max-width: 300px;
        padding: 7px 10px;
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        background: var(--card-solid);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
        color: var(--text);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-line;
        pointer-events: none;
      }
      .tooltip::first-line {
        color: var(--gold);
      }

      /* The bar's readouts carry tips, so they have to be reachable by the pointer. */
      .resource-bar > span {
        pointer-events: auto;
        cursor: help;
      }

      /* How to play: top left, where a player's eye goes first. */
      .help-button {
        position: absolute;
        top: var(--gutter);
        left: var(--gutter);
        font: inherit;
        color: var(--gold);
        background: var(--card);
        border: 1px solid var(--edge-strong);
        border-radius: var(--radius);
        padding: 6px 12px;
        cursor: pointer;
        transition: background 90ms linear, border-color 90ms linear;
      }
      .help-button:hover {
        background: #4a4029;
        border-color: var(--gold);
      }
      .help-button:focus-visible,
      .help__close:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      .help {
        width: min(680px, calc(100vw - 32px));
        max-height: calc(100vh - 64px);
        padding: 0;
        border: 1px solid var(--edge-strong);
        border-radius: 6px;
        background: var(--card-solid);
        color: var(--text);
        font: inherit;
      }
      .help[open] {
        display: flex;
        flex-direction: column;
      }
      .help::backdrop {
        background: rgba(10, 8, 6, 0.62);
      }
      .help__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--edge);
      }
      .help h2 {
        margin: 0;
        color: var(--gold);
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .help__close {
        font: inherit;
        color: var(--text);
        background: rgba(58, 50, 38, 0.72);
        border: 1px solid var(--edge-strong);
        border-radius: 4px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .help__close:hover {
        background: #4a4029;
        border-color: var(--gold);
      }
      .help__body {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 4px 18px 18px;
      }
      .help__intro {
        color: var(--text);
      }
      .help h3 {
        margin: 18px 0 4px;
        color: var(--gold);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .help p {
        margin: 6px 0;
        color: #cfc6b4;
      }
      .help ul {
        margin: 6px 0;
        padding-left: 18px;
        color: #cfc6b4;
      }
      .help li {
        margin: 3px 0;
      }
      .help__terms {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 16px;
        margin: 8px 0 0;
      }
      .help__terms dt {
        color: var(--gold);
      }
      .help__terms dd {
        margin: 0;
        color: #cfc6b4;
      }
      @media (max-width: 520px) {
        .help__terms {
          grid-template-columns: 1fr;
        }
        .help__terms dd {
          margin-bottom: 6px;
        }
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
