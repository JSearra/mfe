name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Golden replay (determinism gate)
        run: npm run replay
      - run: npm run build

      # perf:pathing is pure Node and takes seconds, so it stays on every push.
      # perf:terrain needs a ~94MB Chromium download and a minute of wall clock, so it
      # runs nightly instead — see nightly-perf.yml.
      - name: Pathing performance budget
        run: npm run perf:pathing
