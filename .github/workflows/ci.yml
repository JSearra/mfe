name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Golden replay (determinism gate)
        run: npm run replay
      - run: npm run build

      - name: Pathing performance budget
        run: npm run perf:pathing

      - name: Install Chromium for the performance gate
        run: npx playwright install --with-deps chromium
      - name: Terrain performance budget
        run: npm run perf:terrain -- --duration 30000
